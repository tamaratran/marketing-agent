[project]
name = "marketing-agent"
version = "0.1.0"
description = "Concept radar, video classifier and Seedance preview generator for TikTok organic marketing"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "pydantic>=2",
  "rich>=13",
  "openai>=1.50",
  "playwright>=1.45",
  "httpx>=0.27",
  "cryptography>=42",
  "replicate>=1.0",
  "fal-client>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "fastapi>=0.110", "uvicorn>=0.29"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]

[project.scripts]
mkt = "marketing_agent.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["marketing_agent"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
