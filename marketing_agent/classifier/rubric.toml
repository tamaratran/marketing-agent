# The video rubric: what the video model records about every clip, research or ours, so our posts
# can be lined up with the winners variable by variable. Add a variable by adding a block; the
# prompt and the JSON schema are built from this file. kind is choice, bool, number or text.
# Bump version when a question changes meaning, so stale tags can be found and redone.
version = 1

[[variable]]
key = "content"
group = "content"
kind = "text"
question = "What happens in the video, one plain line"

[[variable]]
key = "first_frame"
group = "content"
kind = "text"
question = "What is on screen in the very first frame"

[[variable]]
key = "payoff"
group = "content"
kind = "text"
question = "How it ends: the payoff, reveal or punchline, empty if none"

[[variable]]
key = "humor"
group = "content"
kind = "bool"
question = "Is it played for a laugh"

[[variable]]
key = "caption_text"
group = "captions"
kind = "text"
question = "The main on-screen caption, quoted exactly, empty if none"

[[variable]]
key = "caption_amount"
group = "captions"
kind = "choice"
options = ["none", "a few words", "one sentence", "several lines", "text heavy"]
question = "How much text is on screen"

[[variable]]
key = "caption_placement"
group = "captions"
kind = "choice"
options = ["none", "top", "centre", "bottom", "moves around"]
question = "Where the caption sits"

[[variable]]
key = "sound_kind"
group = "sound"
kind = "choice"
options = ["trending song", "other music", "game audio", "voiceover", "talking to camera", "mixed", "silent"]
question = "What the audio mostly is"

[[variable]]
key = "sound_name"
group = "sound"
kind = "text"
question = "The song or sound if you can tell, else empty"

[[variable]]
key = "sound_synced"
group = "sound"
kind = "bool"
question = "Are the moves or cuts timed to the beat"

[[variable]]
key = "people_count"
group = "person"
kind = "number"
question = "How many people are on screen"

[[variable]]
key = "person_gender"
group = "person"
kind = "choice"
options = ["woman", "man", "mixed", "no person", "unclear"]
question = "How the main person presents on screen"

[[variable]]
key = "person_build"
group = "person"
kind = "choice"
options = ["slim", "athletic", "average", "plus size", "no person", "unclear"]
question = "The main person's build as it looks on screen"

[[variable]]
key = "person_age"
group = "person"
kind = "choice"
options = ["teen", "20s", "30s to 40s", "older", "no person", "unclear"]
question = "Roughly how old the main person looks"

[[variable]]
key = "person_size_in_frame"
group = "person"
kind = "choice"
options = ["full body", "waist up", "face only", "small in the background", "no person"]
question = "How much of the frame the person fills"

[[variable]]
key = "clothing"
group = "person"
kind = "text"
question = "What the main person is wearing, a few words"

[[variable]]
key = "clothing_type"
group = "person"
kind = "choice"
options = ["gym wear", "casual", "pajamas or loungewear", "costume", "dressed up", "no person"]
question = "The kind of outfit"

[[variable]]
key = "sweaty"
group = "person"
kind = "bool"
question = "Does the person look sweaty or out of breath"

[[variable]]
key = "face_visible"
group = "person"
kind = "bool"
question = "Is the main person's face visible for most of the clip"

[[variable]]
key = "speech"
group = "speech"
kind = "text"
question = "What is said out loud, quoted, empty if nothing"

[[variable]]
key = "talks_to_camera"
group = "speech"
kind = "bool"
question = "Does someone talk straight to the camera"

[[variable]]
key = "movement_speed"
group = "movement"
kind = "choice"
options = ["still", "slow", "medium", "fast", "frantic"]
question = "How fast the person moves"

[[variable]]
key = "movement"
group = "movement"
kind = "text"
question = "What the body does: jumping, ducking, squats, walking, a few words"

[[variable]]
key = "dance"
group = "movement"
kind = "bool"
question = "Is there a dance"

[[variable]]
key = "dance_name"
group = "movement"
kind = "text"
question = "Which dance or trend, if you can tell, else empty"

[[variable]]
key = "energy"
group = "movement"
kind = "choice"
options = ["low", "medium", "high"]
question = "Overall energy of the clip"

[[variable]]
key = "setting"
group = "scene"
kind = "choice"
options = ["living room", "bedroom", "dorm", "gym", "outdoors", "studio", "screen only", "other"]
question = "Where it is filmed"

[[variable]]
key = "camera"
group = "scene"
kind = "choice"
options = ["static on a tripod", "handheld", "selfie", "screen recording", "mixed"]
question = "How it is filmed"

[[variable]]
key = "lighting"
group = "scene"
kind = "choice"
options = ["bright", "normal", "dim"]
question = "How well lit it is"

[[variable]]
key = "screen_visible"
group = "product"
kind = "bool"
question = "Is a TV or phone screen with a game on it visible"

[[variable]]
key = "game_working"
group = "product"
kind = "choice"
options = ["yes", "glitchy or switches game", "no game shown"]
question = "If a game is on screen, does it play smoothly and stay the same game"

[[variable]]
key = "body_controls_game"
group = "product"
kind = "bool"
question = "Is it clear the person's body is controlling the game"

[[variable]]
key = "looks_ai_made"
group = "quality"
kind = "bool"
question = "Does anything look AI generated"

[[variable]]
key = "ai_artifacts"
group = "quality"
kind = "text"
question = "What looks off: warped hands, faces, flicker, mismatched audio, empty if nothing"
